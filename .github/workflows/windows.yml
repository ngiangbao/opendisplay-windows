name: Windows

on:
  pull_request:
    paths:
      - "linux/**"
      - "PROTOCOL.md"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "linux/**"
      - "PROTOCOL.md"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable-rust:
    name: portable Rust crates
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: linux
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: linux

      - name: Test portable crates
        run: >-
          cargo test --locked
          -p opendisplay-proto
          -p opendisplay-session
          -p od-fake-sender

      - name: Test Windows receiver null sink
        run: cargo test --locked -p od-receiver --no-default-features
